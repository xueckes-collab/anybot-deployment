<!--
ANYWAY FLOOR 聊天机器人 Widget
直接复制这段代码到你的网站 HTML 中
v2:登录后才能聊天(姓名 / 邮箱 / 电话,均带前端校验)
-->

<div id="chatbot-widget-container"></div>

<script>
(function() {
  // ==================== 配置 ====================
  const CONFIG = {
    apiUrl: 'http://localhost:8000',           // 改为你的后端地址
    title: '🤖 ANYWAY FLOOR 助手',
    placeholder: '请输入你的问题...',
    welcomeMessage: '欢迎！我是 ANYWAY FLOOR 的智能助手,有什么可以帮你的吗?',

    // sessionStorage 中保存登录信息的 key
    storageKey: 'anybot_user_info',

    // 校验规则(可按需调整)
    validation: {
      // 姓名:2~30 字符,允许中英文与常见姓名分隔符
      nameRegex: /^[\u4e00-\u9fa5A-Za-z][\u4e00-\u9fa5A-Za-z\s.\-·']{1,29}$/,
      // 邮箱:常规 RFC 简化版
      emailRegex: /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/,
      // 电话号码:中国大陆 11 位手机号(1 开头,第二位 3-9),
      // 或以 + 开头的国际区号格式(整体 8~16 位数字,可含空格 / 短横线)
      phoneRegex: /^(?:1[3-9]\d{9}|\+\d[\d\s\-]{6,14}\d)$/
    }
  };

  // ==================== 样式 ====================
  const style = document.createElement('style');
  style.textContent = `
    #chatbot-widget {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 380px;
      height: 600px;
      border-radius: 12px;
      box-shadow: 0 5px 40px rgba(0, 0, 0, 0.16);
      background: white;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      z-index: 9999;
      overflow: hidden;
    }

    #chatbot-widget.minimized {
      height: 60px;
      width: 60px;
    }

    #chatbot-widget.minimized #chatbot-body {
      display: none;
    }

    #chatbot-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    #chatbot-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    #chatbot-header-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .chatbot-icon-btn {
      background: none;
      border: none;
      color: white;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .chatbot-icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    #chatbot-minimize-btn {
      font-size: 20px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    #chatbot-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ---------- 登录界面 ---------- */
    #chatbot-login {
      flex: 1;
      padding: 24px 20px;
      overflow-y: auto;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #chatbot-login-intro {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
      margin: 0 0 4px 0;
    }

    .chatbot-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chatbot-field label {
      font-size: 12px;
      color: #444;
      font-weight: 500;
    }

    .chatbot-field label .required {
      color: #e53935;
      margin-left: 2px;
    }

    .chatbot-field input {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 9px 11px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .chatbot-field input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .chatbot-field.invalid input {
      border-color: #e53935;
    }

    .chatbot-field.invalid input:focus {
      box-shadow: 0 0 0 3px rgba(229, 57, 53, 0.15);
    }

    .chatbot-field-error {
      font-size: 12px;
      color: #e53935;
      min-height: 16px;
      line-height: 1.3;
    }

    #chatbot-login-submit {
      margin-top: 6px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.05s;
    }

    #chatbot-login-submit:hover {
      opacity: 0.92;
    }

    #chatbot-login-submit:active {
      transform: translateY(1px);
    }

    #chatbot-login-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #chatbot-login-tip {
      font-size: 11px;
      color: #888;
      text-align: center;
      margin-top: 4px;
    }

    /* ---------- 聊天界面 ---------- */
    #chatbot-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #chatbot-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8f9fa;
    }

    .chatbot-message {
      display: flex;
      gap: 8px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chatbot-message.user {
      justify-content: flex-end;
    }

    .chatbot-message-content {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .chatbot-message.assistant .chatbot-message-content {
      background: white;
      color: #333;
      border: 1px solid #e0e0e0;
    }

    .chatbot-message.user .chatbot-message-content {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .chatbot-message.system .chatbot-message-content {
      background: #fff3cd;
      color: #856404;
      font-size: 12px;
      text-align: center;
      max-width: 100%;
    }

    #chatbot-input-area {
      padding: 12px;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      background: white;
    }

    #chatbot-input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    #chatbot-input:focus {
      border-color: #667eea;
    }

    #chatbot-send-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #chatbot-send-btn:hover {
      opacity: 0.9;
    }

    #chatbot-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .chatbot-loading {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .chatbot-loading span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #667eea;
      animation: bounce 1.4s infinite;
    }

    .chatbot-loading span:nth-child(2) { animation-delay: 0.2s; }
    .chatbot-loading span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% {
        opacity: 0.5;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-8px);
      }
    }

    @media (max-width: 480px) {
      #chatbot-widget {
        width: 100%;
        height: 100%;
        bottom: 0;
        right: 0;
        border-radius: 0;
      }

      #chatbot-widget.minimized {
        width: 60px;
        height: 60px;
        bottom: 20px;
        right: 20px;
        border-radius: 50%;
      }
    }
  `;
  document.head.appendChild(style);

  // ==================== HTML 结构 ====================
  function createWidget() {
    const container = document.getElementById('chatbot-widget-container');

    const widget = document.createElement('div');
    widget.id = 'chatbot-widget';
    widget.innerHTML = `
      <div id="chatbot-header">
        <h3>${CONFIG.title}</h3>
        <div id="chatbot-header-actions">
          <button id="chatbot-logout-btn" class="chatbot-icon-btn" title="退出登录" style="display:none;">退出</button>
          <button id="chatbot-minimize-btn" class="chatbot-icon-btn">−</button>
        </div>
      </div>
      <div id="chatbot-body">
        <!-- 登录界面 -->
        <form id="chatbot-login" novalidate>
          <p id="chatbot-login-intro">为了更好地为您服务,请先填写以下信息:</p>

          <div class="chatbot-field" data-field="name">
            <label for="chatbot-login-name">姓名<span class="required">*</span></label>
            <input id="chatbot-login-name" name="name" type="text" autocomplete="name" placeholder="请输入您的姓名" />
            <div class="chatbot-field-error"></div>
          </div>

          <div class="chatbot-field" data-field="email">
            <label for="chatbot-login-email">邮箱<span class="required">*</span></label>
            <input id="chatbot-login-email" name="email" type="email" autocomplete="email" placeholder="example@domain.com" />
            <div class="chatbot-field-error"></div>
          </div>

          <div class="chatbot-field" data-field="phone">
            <label for="chatbot-login-phone">电话号码<span class="required">*</span></label>
            <input id="chatbot-login-phone" name="phone" type="tel" autocomplete="tel" placeholder="如 13812345678 或 +86 138 1234 5678" />
            <div class="chatbot-field-error"></div>
          </div>

          <button type="submit" id="chatbot-login-submit">开始对话</button>
          <p id="chatbot-login-tip">提交即视为同意我们将上述信息用于本次咨询。</p>
        </form>

        <!-- 聊天界面 -->
        <div id="chatbot-chat" style="display:none;">
          <div id="chatbot-messages"></div>
          <div id="chatbot-input-area">
            <input
              type="text"
              id="chatbot-input"
              placeholder="${CONFIG.placeholder}"
              autocomplete="off"
            />
            <button id="chatbot-send-btn">发送</button>
          </div>
        </div>
      </div>
    `;

    container.appendChild(widget);
    return widget;
  }

  // ==================== 校验逻辑 ====================
  function validateField(field, value) {
    const v = (value || '').trim();
    const r = CONFIG.validation;

    if (field === 'name') {
      if (!v) return '请输入您的姓名';
      if (v.length < 2) return '姓名至少 2 个字符';
      if (!r.nameRegex.test(v)) return '姓名仅支持中英文、空格与 . - · \' 字符';
      return '';
    }
    if (field === 'email') {
      if (!v) return '请输入邮箱地址';
      if (!r.emailRegex.test(v)) return '邮箱格式不正确';
      return '';
    }
    if (field === 'phone') {
      if (!v) return '请输入电话号码';
      // 国际格式校验时把空格 / 短横线先剥掉再看长度
      const stripped = v.replace(/[\s\-]/g, '');
      if (!r.phoneRegex.test(v) || stripped.replace(/^\+/, '').length < 8) {
        return '请输入有效的手机号或国际电话号码';
      }
      return '';
    }
    return '';
  }

  function setFieldError(fieldEl, msg) {
    const errorEl = fieldEl.querySelector('.chatbot-field-error');
    errorEl.textContent = msg || '';
    fieldEl.classList.toggle('invalid', !!msg);
  }

  // ==================== 初始化 ====================
  function init() {
    const widget = createWidget();
    const minimizeBtn = document.getElementById('chatbot-minimize-btn');
    const logoutBtn = document.getElementById('chatbot-logout-btn');

    const loginForm = document.getElementById('chatbot-login');
    const chatPanel = document.getElementById('chatbot-chat');
    const messagesDiv = document.getElementById('chatbot-messages');
    const inputField = document.getElementById('chatbot-input');
    const sendBtn = document.getElementById('chatbot-send-btn');

    let sessionId = null;
    let userInfo = null;
    let welcomeShown = false;

    // ---------- 最小化 ----------
    minimizeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      widget.classList.toggle('minimized');
      minimizeBtn.textContent = widget.classList.contains('minimized') ? '+' : '−';
    });

    // ---------- 登录态切换 ----------
    function showLogin() {
      loginForm.style.display = 'flex';
      chatPanel.style.display = 'none';
      logoutBtn.style.display = 'none';
    }

    function showChat() {
      loginForm.style.display = 'none';
      chatPanel.style.display = 'flex';
      logoutBtn.style.display = 'inline-block';
      if (!welcomeShown) {
        const greet = userInfo && userInfo.name
          ? `${userInfo.name},${CONFIG.welcomeMessage}`
          : CONFIG.welcomeMessage;
        addMessage(greet, 'assistant');
        welcomeShown = true;
      }
      setTimeout(() => inputField.focus(), 50);
    }

    // 已登录?直接进聊天
    try {
      const stored = sessionStorage.getItem(CONFIG.storageKey);
      if (stored) {
        const parsed = JSON.parse(stored);
        if (parsed && parsed.name && parsed.email && parsed.phone) {
          userInfo = parsed;
        }
      }
    } catch (_) { /* ignore */ }

    if (userInfo) {
      showChat();
    } else {
      showLogin();
    }

    // ---------- 登录:实时校验 ----------
    ['name', 'email', 'phone'].forEach((name) => {
      const fieldEl = loginForm.querySelector(`.chatbot-field[data-field="${name}"]`);
      const inp = fieldEl.querySelector('input');
      inp.addEventListener('blur', () => {
        setFieldError(fieldEl, validateField(name, inp.value));
      });
      inp.addEventListener('input', () => {
        if (fieldEl.classList.contains('invalid')) {
          setFieldError(fieldEl, validateField(name, inp.value));
        }
      });
    });

    // ---------- 登录:提交 ----------
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const data = {
        name: loginForm.querySelector('[name="name"]').value.trim(),
        email: loginForm.querySelector('[name="email"]').value.trim(),
        phone: loginForm.querySelector('[name="phone"]').value.trim()
      };

      let firstInvalid = null;
      ['name', 'email', 'phone'].forEach((name) => {
        const fieldEl = loginForm.querySelector(`.chatbot-field[data-field="${name}"]`);
        const msg = validateField(name, data[name]);
        setFieldError(fieldEl, msg);
        if (msg && !firstInvalid) firstInvalid = fieldEl.querySelector('input');
      });

      if (firstInvalid) {
        firstInvalid.focus();
        return;
      }

      userInfo = {
        name: data.name,
        email: data.email,
        phone: data.phone,
        loginAt: new Date().toISOString()
      };

      try {
        sessionStorage.setItem(CONFIG.storageKey, JSON.stringify(userInfo));
      } catch (_) { /* sessionStorage 可能被禁用,忽略 */ }

      // 重置 session(换人重新开始)
      sessionId = null;
      welcomeShown = false;
      messagesDiv.innerHTML = '';
      showChat();
    });

    // ---------- 退出登录 ----------
    logoutBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      try { sessionStorage.removeItem(CONFIG.storageKey); } catch (_) {}
      userInfo = null;
      sessionId = null;
      welcomeShown = false;
      messagesDiv.innerHTML = '';
      // 清空表单 + 错误状态
      loginForm.reset();
      loginForm.querySelectorAll('.chatbot-field').forEach((el) => setFieldError(el, ''));
      showLogin();
    });

    // ---------- 发送消息 ----------
    async function sendMessage() {
      // 防止上一条请求未结束时被 Enter 键重复触发
      if (sendBtn.disabled) return;
      const message = inputField.value.trim();
      if (!message) return;
      if (!userInfo) {
        showLogin();
        return;
      }

      inputField.value = '';
      addMessage(message, 'user');
      sendBtn.disabled = true;

      try {
        const response = await fetch(`${CONFIG.apiUrl}/api/chat/stream`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            // 把用户信息一起带给后端,方便记录 / 限流 / 客服跟进
            'X-User-Name': encodeURIComponent(userInfo.name),
            'X-User-Email': userInfo.email,
            'X-User-Phone': userInfo.phone
          },
          body: JSON.stringify({
            message: message,
            session_id: sessionId,
            user: {
              name: userInfo.name,
              email: userInfo.email,
              phone: userInfo.phone
            }
          })
        });

        if (!response.ok) throw new Error('请求失败');

        // ---- 解析标准 SSE 流(event: ... \n data: ...\n\n) ----
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullResponse = '';
        let messageElement = null;
        let buffer = '';

        const handleEvent = (eventName, data) => {
          if (eventName === 'meta') {
            try {
              const parsed = JSON.parse(data);
              if (parsed && parsed.session_id) sessionId = parsed.session_id;
            } catch (_) { /* ignore malformed meta */ }
          } else if (eventName === 'token') {
            if (data === '') return;
            fullResponse += data;
            if (!messageElement) {
              messageElement = addMessage('', 'assistant');
            }
            messageElement.querySelector('.chatbot-message-content').textContent = fullResponse;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
          } else if (eventName === 'error') {
            let msg = '抱歉,出现了错误。请稍后重试。';
            try {
              const parsed = JSON.parse(data);
              if (parsed && parsed.error) msg = '错误:' + parsed.error;
            } catch (_) {}
            addMessage(msg, 'system');
          }
          // 'done' / unknown events: 忽略
        };

        const flushEvent = (block) => {
          if (!block || !block.trim()) return;
          let eventName = 'message';
          const dataLines = [];
          for (const rawLine of block.split(/\r?\n/)) {
            if (!rawLine || rawLine.startsWith(':')) continue; // 注释行
            if (rawLine.startsWith('event:')) {
              eventName = rawLine.slice(6).trim();
            } else if (rawLine.startsWith('data:')) {
              // 按 SSE 规范,data: 后第一个空格属于分隔符,之后才是数据
              dataLines.push(rawLine.slice(5).replace(/^ /, ''));
            }
          }
          handleEvent(eventName, dataLines.join('\n'));
        };

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          let sepIdx;
          // \n\n 或 \r\n\r\n 都算一个事件结束
          while ((sepIdx = buffer.search(/\r?\n\r?\n/)) !== -1) {
            const block = buffer.slice(0, sepIdx);
            const matchLen = buffer.slice(sepIdx).match(/^\r?\n\r?\n/)[0].length;
            buffer = buffer.slice(sepIdx + matchLen);
            flushEvent(block);
          }
        }
        // 处理结尾未带分隔符的最后一个事件
        if (buffer.trim()) {
          flushEvent(buffer);
          buffer = '';
        }
      } catch (error) {
        console.error('错误:', error);
        addMessage('抱歉,出现了错误。请稍后重试。', 'system');
      } finally {
        sendBtn.disabled = false;
        inputField.focus();
      }
    }

    function addMessage(text, role) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `chatbot-message ${role}`;
      messageDiv.innerHTML = `<div class="chatbot-message-content"></div>`;
      messageDiv.querySelector('.chatbot-message-content').textContent = text;
      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return messageDiv;
    }

    // ---------- 事件监听 ----------
    sendBtn.addEventListener('click', sendMessage);
    inputField.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  }

  // 页面加载完成后初始化
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
